modLoader = "javafml"
loaderVersion = "[1,)"
license = "${license}"
issueTrackerURL = "${issues}"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "${authors}"
description = "${description}"
displayURL = "${homepage}"
logoFile = "assets/presetswitcher/icon.png"

[[mixins]]
config = "presetswitcher.mixins.json"

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "[${loader_min},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "CLIENT"
