# Shared properties, overridden per Minecraft version ["x"] and per loader+version [loader."x"].
# See https://stonecutter.kikugie.dev/wiki/config/properties#centralized-properties
mod.id = "presetswitcher"
mod.name = "Preset Switcher"
mod.version = "1.1.0"
mod.group = "io.github.imaron85"
mod.description = "Lets modpacks offer selectable settings presets (e.g. Potato / Default / Beautiful). Players pick one on first launch and can switch later from Options > Presets...; the preset's configs are merged in before other mods load them, keeping keybinds and personal settings."
mod.authors = "ImAron"
mod.license = "MIT"
mod.homepage = "https://modrinth.com/mod/preset-switcher"
mod.sources = "https://github.com/imaron85/preset-switcher"
mod.issues = "https://github.com/imaron85/preset-switcher/issues"

deps.fabric_loader = "0.19.5"
# Lowest Fabric Loader the jars declare (fabric.mod.json)
deps.fabric_loader_min = "0.15.0"
loomx.loom_version = "1.19.3"
# Early hook (documentation only; see README "When presets are applied"): language_adapter (Fabric/Quilt),
# language_provider (Forge, nested jar), language_loader (NeoForge, nested jar)
early.hook = "language_adapter"

# One section per Stonecutter node (the version the jar is compiled against) and the release range it supports.
["1.20.1"]
java.version = 17
mod.mc_releases = ["1.20", "1.20.1"]
mod.mc_label = "1.20-1.20.1"

[fabric."1.20.1"]
# Compile against Fabric Loader 0.15 (Mixin 0.8.5 annotations, see the Sturdy Elytras port)
deps.fabric_loader = "0.15.11"
mod.mc_compat = ">=1.20 <=1.20.1"

[forge."1.20.1"]
early.hook = "language_provider"
mod.mc_label = "1.20.1"
mod.mc_releases = ["1.20.1"]
mod.mc_compat = "[1.20.1]"
deps.forge = "1.20.1-47.4.28"
deps.forge_min = "47"

